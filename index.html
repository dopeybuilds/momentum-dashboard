<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="index.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
    <main>
        <div class="top" id="top">
            <div>
                <p class="coin" id="coin"></p>
                <div class="coin-data" id="coin-data">
                    <iconify-icon icon="akar-icons:statistic-up" class="up-icon"></iconify-icon>
                    <p class="price-high" id="price-high"></p>
                </div>
                <div class="coin-data" id="coin-data">
                    <iconify-icon icon="akar-icons:statistic-down" class="down-icon"></iconify-icon>
                    <p class="price-low" id="price-low"></p>
                </div>
            </div>
            <div id="weather" class="weather">
                <p></p>
            </div>

        </div>

        <div id="clock" class="clock">00:00 AM</div>

        <p class="author" id="author"></p>
    </main>
    
<script src="index.js"></script>
</body>
</html>
